# Demo en Render, plan gratis: la API de Laravel (backend/) y su base PostgreSQL.
# La web Brunito vive en Vercel y le pide los datos a esta API.
services:
  - type: web
    name: brunito-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_NAME
        value: Timbre
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: brunito-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: SITE_URL
        value: https://brunito-one.vercel.app
      # La misma clave va en Vercel (SITE_PROXY_KEY): así los límites se cuentan por visitante.
      - key: SITE_PROXY_KEY
        generateValue: true

databases:
  - name: brunito-db
    plan: free
    region: virginia
    databaseName: brunito
    user: brunito
